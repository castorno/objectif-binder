name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (audit, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Known vulnerabilities in the dependencies; lower severities are reported, not blocking.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    name: Backend (audit, PHPStan, PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "!ChangeMe!"
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_pgsql
          coverage: none

      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      # PHPStan reads the services from the compiled dev container.
      - run: php bin/console cache:warmup
      - run: vendor/bin/phpstan analyse --no-progress
      - run: php bin/console --env=test doctrine:database:create --if-not-exists
      - run: php bin/console --env=test doctrine:migrations:migrate --no-interaction
      - run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
      - run: php bin/phpunit

  backend-image:
    name: Backend (production image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Nothing else builds this target: without this job it could break unnoticed.
      - run: docker build --target frankenphp_prod backend

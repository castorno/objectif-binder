security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                # No `property`: UserRepository::loadUserByIdentifier() does the lookup.
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            # No session: every request proves who it is with its own JWT, and
            # the user is reloaded from the database each time.
            stateless: true
            provider: app_user_provider
            # What an unauthenticated request to a protected route gets: the JWT 401.
            entry_point: jwt
            json_login:
                check_path: api_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Slows password guessing: 5 failed attempts per minute for a given
            # e-mail and client address (and 25 per address, all e-mails together).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            jwt: ~
            # Exchanges the refresh token cookie for a new JWT (and a new cookie).
            refresh_jwt:
                check_path: api_auth_refresh
                invalidate_token_on_logout: true
            # Deletes the refresh token and clears its cookie.
            logout:
                path: api_auth_logout
        main:
            lazy: true
            provider: app_user_provider

    # Note: Only the *first* matching rule is applied.
    # The API is closed by default: anything not listed as public here requires
    # an authenticated user, so a new route cannot be exposed by omission.
    access_control:
        - { path: ^/api/auth/(login|register|refresh|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/health$, roles: PUBLIC_ACCESS }
        # Administration: the role is only ever given by a console command.
        - { path: ^/api/admin(/|$), roles: ROLE_ADMIN }
        # Before the rule that opens the catalog: a price may cost a request to a third party.
        - { path: ^/api/cards/[^/]+/price$, roles: ROLE_USER }
        - { path: ^/api/(games|cards|identities)(/|$), methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

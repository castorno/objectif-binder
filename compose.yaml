# Root entry point: `docker compose up` here starts the whole stack
# (backend API + Postgres + frontend dev server). Backend services are
# defined in backend/compose.yaml and included here rather than duplicated,
# so `cd backend && docker compose up` still works for backend-only work.
# Both backend files go in ONE include entry, so Compose merges them like
# `-f compose.yaml -f compose.override.yaml` (later file wins). Listing them as
# two separate entries makes recent Compose versions reject the duplicate `php`
# service ("services.php conflicts with imported resource").
include:
  - path:
      - backend/compose.yaml
      - backend/compose.override.yaml

services:
  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      # Where the dev server relays /api: the API container, on the compose network.
      API_PROXY_TARGET: http://php:80
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - php
